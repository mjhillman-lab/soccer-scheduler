name: Daily 48-Hour Soccer Scheduler

on:
  schedule:
    - cron: '10 17 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime via button click

permissions:
  contents: write
  
jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and push generated schedules and cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Automated daily schedule update [skip ci]" && git push origin main)